name: Build & Release App

on:
  push:
    branches:
      - 'master'
      - 'main'
    tags:
      - '[0-9][0-9].[0-9][0-9].[0-9][0-9]*'
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'oracle'
          java-version: 17
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK with retries
        run: |
          SDKMANAGER="sdkmanager"
          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -f "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          for i in {1..5}; do
            echo "y" | $SDKMANAGER "ndk;21.4.7075529" && break
            echo "NDK download failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Create debug keystore
        env:
          CI_KEYSTORE: ${{ secrets.CI_KEYSTORE }}
          CI_KEYSTORE_DECRYPT: ${{ secrets.CI_KEYSTORE_DECRYPT }}
        if: ${{ env.CI_KEYSTORE != '' && env.CI_KEYSTORE_DECRYPT != '' }}
        run: |
          mkdir -p ~/.android
          echo "$CI_KEYSTORE" > debug.keystore.asc
          gpg -d --passphrase "$CI_KEYSTORE_DECRYPT" --batch debug.keystore.asc > ~/.android/debug.keystore

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build debug APK
        run: bash ./gradlew assembleCi --stacktrace
        env:
          RELEASE_KEYSTORE_PATH: "release.jks"
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: set apk name env
        run: echo "APK_NAME=$(basename app/build/outputs/apk/ci/*.apk .apk)" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/ci/${{ env.APK_NAME }}.apk

      - name: Create GitHub Release (Tag Release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/ci/${{ env.APK_NAME }}.apk
          generate_release_notes: true
          prerelease: false

      - name: Update Nightly GitHub Release (Normal Push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: "Automated nightly build from master branch."
          files: app/build/outputs/apk/ci/${{ env.APK_NAME }}.apk
          prerelease: true
          make_latest: false

