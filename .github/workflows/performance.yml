name: Performance measurements
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per scenario (1–30)
        type: number
        default: 10
  push:
    branches: ['fix/performance-profiling']
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK, NDK and emulator
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;21.4.7075529' 'cmake;3.22.1' 'emulator' 'system-images;android-36;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name performance --package 'system-images;android-36;google_apis;x86_64'
      - name: Build profiling APKs
        run: ./gradlew :app:assembleBenchmark :macrobenchmark:assembleBenchmark -PperformanceBenchmarks=true --max-workers=2 --stacktrace
      - name: Measure on disposable emulator
        timeout-minutes: 25
        env:
          PERFORMANCE_ITERATIONS: ${{ inputs.iterations || 10 }}
          EPHEMERAL_DEVICE: 'true'
        run: |
          mkdir -p performance-artifacts
          "$ANDROID_HOME/emulator/emulator" -avd performance -memory 4096 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > performance-artifacts/emulator.log 2>&1 &
          trap 'adb emu kill || true' EXIT
          timeout 240 adb wait-for-device
          for attempt in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          bash tools/run-performance.sh
      - name: Publish measurements
        if: always()
        run: python3 tools/summarize-performance.py macrobenchmark/build/outputs performance-artifacts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-api36-${{ github.sha }}
          path: |
            performance-artifacts/
            macrobenchmark/build/outputs/
            macrobenchmark/build/reports/
          retention-days: 30
