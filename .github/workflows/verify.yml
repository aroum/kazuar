name: Verify Android changes

on:
  push:
    branches: ['fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install project SDK and NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;21.4.7075529' 'cmake;3.22.1'
      - name: Run native dictionary regressions with sanitizers
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev
          cmake -S app/src/main/jni/tests -B "$RUNNER_TEMP/native-tests" -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/native-tests" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/native-tests" --output-on-failure --output-junit "$RUNNER_TEMP/native-results.xml"
      - name: Verify generated sources follow input edits
        run: python3 tools/check-generated-sources.py
      - name: Test Android 13 and 16 settings and backup regressions
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.KEY_PASSWORD || '' }}
        run: |
          umask 077
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # PRs only verify builds; they never receive the persistent private key.
            export KEYSTORE_PASSWORD=android
            export KEY_ALIAS=verification
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/verification.jks" \
              -storepass android -keypass android -alias verification \
              -dname "CN=kazuar PR verification" -keyalg RSA -keysize 2048 -validity 365
          else
            for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [[ -z "${!name}" ]]; then
                echo "::error::Missing persistent signing secret: $name"
                exit 1
              fi
            done
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/verification.jks"
          fi
          keytool -exportcert -keystore "$RUNNER_TEMP/verification.jks" \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" \
            -file "$RUNNER_TEMP/expected-signing-cert.der"
      - name: Build APKs and native libraries for all configured ABIs
        run: |
          python3 tools/make-resource-smoke-manifest.py
          ./gradlew :app:assembleDebug :app:assembleCi :app:assembleCiAndroidTest --stacktrace --console=plain
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/verification.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ github.event_name == 'pull_request' && 'android' || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ github.event_name == 'pull_request' && 'verification' || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ github.event_name == 'pull_request' && 'android' || secrets.KEY_PASSWORD }}
      - name: Verify CI APK signing certificate
        run: |
          expected=$(sha256sum "$RUNNER_TEMP/expected-signing-cert.der" | cut -d ' ' -f 1)
          for apk in app/build/outputs/apk/ci/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt"
            actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::CI APK signing certificate mismatch: $apk"
              exit 1
            fi
            echo "$(basename "$apk"): signer SHA-256 $actual"
          done
      - name: Verify APK minimum Android version
        run: |
          for apk in app/build/outputs/apk/{debug,ci}/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/apk-badging.txt"
            grep -qx "sdkVersion:'33'" "$RUNNER_TEMP/apk-badging.txt"
          done
      - name: Verify 16 KiB ELF and APK alignment
        run: >-
          python3 tools/check-apk-page-alignment.py
          --zipalign "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          app/build/outputs/apk/{debug,ci}/*.apk

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: kazuar-apks-${{ github.sha }}
          path: app/build/outputs/apk/ci/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v7
        with:
          name: kazuar-smoke-tests-${{ github.sha }}
          path: app/build/outputs/apk/androidTest/ci/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-results.xml
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*

  shrunk-apk-runtime:
    name: Test shrunk CI APK on 16 KiB Android
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v8
        with:
          name: kazuar-apks-${{ github.sha }}
          path: runtime-apks
      - uses: actions/download-artifact@v8
        with:
          name: kazuar-smoke-tests-${{ github.sha }}
          path: runtime-tests
      - name: Install 16 KiB Android emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis_ps16k;x86_64'
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name kazuar16k --package 'system-images;android-35;google_apis_ps16k;x86_64'
      - name: Run packaged resource and keyboard smoke tests
        timeout-minutes: 12
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd kazuar16k -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          trap 'adb logcat -d > logcat.txt; adb emu kill || true' EXIT
          timeout 240 adb wait-for-device
          for attempt in {1..120}; do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82
          test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = "16384"
          adb install runtime-apks/*-x86_64.apk
          adb install runtime-tests/*.apk
          adb shell am instrument -w -r io.github.aroum.kazuar.inputmethod.latin.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
          grep -q '^OK (3 tests)' instrumentation.txt
          ! grep -Eq 'FAILURES|INSTRUMENTATION_FAILED|shortMsg=' instrumentation.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shrunk-apk-runtime-${{ github.sha }}
          path: |
            instrumentation.txt
            emulator.log
            logcat.txt
