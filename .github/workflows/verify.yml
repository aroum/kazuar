name: Verify Android changes

on:
  push:
    branches: ['fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install project SDK and NDK
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'ndk;21.4.7075529'
      - name: Test Android 13 settings and backup regressions
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain
      - name: Build APKs and native libraries for all configured ABIs
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: kazuar-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
