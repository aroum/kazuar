apply plugin: 'java'
apply plugin: 'kotlin'

version 'unspecified'

jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes['Main-Class'] = 'com.majeur.inputmethod.tools.emoji.MakeEmojiKeys' }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
}

def outputDirectory = layout.buildDirectory.dir('generated/res')
tasks.register('makeEmoji', JavaExec) {
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.dir(outputDirectory)
    classpath = files(tasks.named('jar').flatMap { it.archiveFile })
    mainClass.set('com.majeur.inputmethod.tools.emoji.MakeEmojiKeys')
    args '-res', outputDirectory.get().asFile.absolutePath
}

repositories { mavenCentral() }
java {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
