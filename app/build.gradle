apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {

    namespace "io.github.sds100.keymapper.inputmethod.latin"
    compileSdk 34
    buildToolsVersion = '34.0.0'

    defaultConfig {
        applicationId "io.github.sds100.keymapper.inputmethod.latin"
        minSdkVersion 19
        targetSdkVersion 34
        versionCode 27
        versionName '26.09.11'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH") ?: "release.jks"
            def keystorePasswordEnv = System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: ""
            def keyAliasEnv = System.getenv("RELEASE_KEY_ALIAS") ?: ""
            def keyPasswordEnv = System.getenv("RELEASE_KEY_PASSWORD") ?: ""

            def ksFile = file(keystorePath)
            if (!ksFile.exists()) {
                ksFile = file("../" + keystorePath)
            }
            if (!ksFile.exists()) {
                ksFile = file("app/" + keystorePath)
            }

            if (ksFile.exists() && !keystorePasswordEnv.isEmpty()) {
                storeFile ksFile
                storePassword keystorePasswordEnv
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            } else {
                storeFile file("debug.keystore")
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'src/main/proguard.flags'
        }
        debug {
            versionNameSuffix "-debug"
        }
        ci {
            minifyEnabled true
            shrinkResources true
            debuggable = false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'src/main/proguard.flags'
            signingConfig signingConfigs.release
        }
    }


    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildFeatures {
        aidl true
    }

    lintOptions {
        abortOnError false
    }

    ndkVersion '21.4.7075529'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        noCompress 'dict'
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def suffix = abi != null ? "-${abi}" : "-universal"
        outputFileName = "kazuar-keyboard-${variant.versionName}${suffix}.apk"
    }
}

dependencies {
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.collection:collection:1.4.0'
}

repositories {
    mavenCentral()
}
