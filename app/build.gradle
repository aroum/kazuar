apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {

    namespace "io.github.aroum.kazuar.inputmethod.latin"
    compileSdk 36
    buildToolsVersion = '35.0.0'

    defaultConfig {
        applicationId "io.github.aroum.kazuar.inputmethod.latin"
        minSdkVersion 33
        targetSdkVersion 34
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static' }
        }
        resourceConfigurations += ['en', 'ru']
        resValue 'string', 'build_revision', System.getenv('GITHUB_SHA') ?: 'local'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 32
        def appVersionName = System.getenv("VERSION_NAME") ?: (project.findProperty("versionName") ?: '26.10.18')
        versionName appVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH") ?: "release.jks"
            def keystorePasswordEnv = System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: ""
            def keyAliasEnv = System.getenv("RELEASE_KEY_ALIAS") ?: ""
            def keyPasswordEnv = System.getenv("RELEASE_KEY_PASSWORD") ?: ""

            def ksFile = file(keystorePath)
            if (!ksFile.exists()) {
                ksFile = file("../" + keystorePath)
            }
            if (!ksFile.exists()) {
                ksFile = file("app/" + keystorePath)
            }

            if (ksFile.exists() && !keystorePasswordEnv.isEmpty()) {
                storeFile ksFile
                storePassword keystorePasswordEnv
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            } else {
                storeFile file("debug.keystore")
            }
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            versionNameSuffix "-debug"
        }
        ci {
            minifyEnabled true
            shrinkResources true
            debuggable = false

            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
            testProguardFiles 'proguard-android-test.pro'
        }
    }


    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes.configureEach {
        resValue 'string', 'build_variant', name
    }

    buildFeatures {
        resValues = true
    }

    testBuildType 'ci'
    sourceSets.androidTest.assets.srcDir 'build/generated/resource-smoke-assets'

    testOptions {
        unitTests.includeAndroidResources = true
    }

    lint {
        abortOnError false
    }

    ndkVersion '21.4.7075529'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }


    sourceSets {
        main {
            java.srcDir project(':tools:make-keyboard-text').layout.buildDirectory.dir('generated/java')
            res.srcDir project(':tools:make-emoji-keys').layout.buildDirectory.dir('generated/res')
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    androidResources {
        noCompress 'dict'
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def abi = output.getFilter(com.android.build.OutputFile.ABI)
        def suffix = abi != null ? "-${abi}" : "-universal"
        outputFileName = "kazuar-keyboard-${variant.versionName}${suffix}.apk"
    }
}

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.collection:collection:1.5.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.json:json:20240303'
}

repositories {
    mavenCentral()
}

// Generation precedes Kotlin/Java compilation and Android resource merging.
tasks.named('preBuild').configure {
    dependsOn ':tools:make-keyboard-text:makeText', ':tools:make-emoji-keys:makeEmoji'
}

// Use the plugin-provided standard library and typed compiler options for app and generators.
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}
