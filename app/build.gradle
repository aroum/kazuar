apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {

    namespace "io.github.sds100.keymapper.inputmethod.latin"
    compileSdk 34
    buildToolsVersion = '34.0.0'

    defaultConfig {
        applicationId "io.github.sds100.keymapper.inputmethod.latin"
        minSdkVersion 19
        targetSdkVersion 34
        versionCode 25
        versionName '26.08.10'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH") ?: "release.jks"
            def keystorePasswordEnv = System.getenv("RELEASE_KEYSTORE_PASSWORD") ?: ""
            def keyAliasEnv = System.getenv("RELEASE_KEY_ALIAS") ?: ""
            def keyPasswordEnv = System.getenv("RELEASE_KEY_PASSWORD") ?: ""

            if (new File(keystorePath).exists() && !keystorePasswordEnv.isEmpty()) {
                storeFile file(keystorePath)
                storePassword keystorePasswordEnv
                keyAlias keyAliasEnv
                keyPassword keyPasswordEnv
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            jniDebuggable false
            renderscriptDebuggable false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'src/main/proguard.flags'
        }
        debug {
            versionNameSuffix "-debug"
        }
        ci {
            minifyEnabled true
            shrinkResources true
            debuggable = true

            versionNameSuffix "-ci.$RUN_NUMBER"
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'src/main/proguard.flags'
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }


    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildFeatures {
        aidl true
    }

    lintOptions {
        abortOnError false
    }

    ndkVersion '21.4.7075529'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    androidResources {
        noCompress 'dict'
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "kazuar-keyboard-${variant.versionName}.apk"
    }
}

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    // Replaces recyclerview:1.0.0 included by above dependency
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}

repositories {
    mavenCentral()
}
